<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Try DaySift</title>
  <meta name="description" content="Press ⌘J to search your browsing history with DaySift.">
  <link rel="icon" href="favicon.png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="favicon-dark.png" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F8F7F4;
      --bg-alt: #F0EFEC;
      --foreground: #1a1a1a;
      --muted: #6b6b6b;
      --muted-light: #999;
      --border: #e5e4e1;
      --accent: #F46B45;
      --accent-hover: #E85D38;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0a;
        --bg-alt: #171717;
        --foreground: #fafafa;
        --muted: #a1a1aa;
        --muted-light: #71717a;
        --border: #27272a;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--foreground);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      background-image:
        linear-gradient(rgba(0,0,0,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-image:
          linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      }
    }

    .container {
      text-align: center;
    }

    .logo {
      height: 48px;
      color: var(--foreground);
      margin-bottom: 64px;
    }

    .prompt {
      font-size: 20px;
      font-weight: 500;
      color: var(--foreground);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      font-family: inherit;
      font-size: 32px;
      font-weight: 600;
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--foreground);
      box-shadow: 0 2px 0 var(--border);
    }

    .subtitle {
      font-size: 17px;
      color: var(--muted);
      margin-bottom: 64px;
    }

    .back-link {
      font-size: 14px;
      color: var(--muted-light);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s;
    }

    .back-link:hover {
      color: var(--foreground);
    }

    .back-link svg {
      width: 16px;
      height: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- DaySift Logo -->
    <svg class="logo" viewBox="0 0 381 381" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M223.926 74.9766C303.409 74.9766 354.253 120.028 354.253 190.501C354.253 260.974 303.409 306.026 223.926 306.026H111.831C109.048 306.026 106.793 303.77 106.793 300.987V275.667C106.793 272.884 109.048 270.628 111.831 270.628H223.926C278.953 270.628 312.098 239.092 312.098 190.501C312.098 141.588 278.953 110.374 223.604 110.374H111.831C109.049 110.374 106.793 108.118 106.793 105.336V80.0156C106.793 77.233 109.048 74.9767 111.831 74.9766H223.926ZM153.775 208.912C156.558 208.912 158.814 211.168 158.814 213.951V239.092C158.814 241.875 156.558 244.131 153.775 244.131H31.7852C29.0024 244.131 26.7461 241.875 26.7461 239.092V213.951C26.7461 211.168 29.0024 208.912 31.7852 208.912H153.775ZM182.703 149.798C185.486 149.798 187.742 152.053 187.742 154.836V179.978C187.742 182.76 185.486 185.016 182.703 185.016H60.7119C57.9294 185.015 55.6739 182.76 55.6738 179.978V154.836C55.674 152.053 57.9295 149.798 60.7119 149.798H182.703Z" fill="currentColor"/>
    </svg>

    <div class="prompt">
      Press <kbd class="kbd" id="shortcut"></kbd>
    </div>

    <p class="subtitle">to search your browsing history</p>

    <a href="https://daysift.com" class="back-link">
      <!-- Lucide: arrow-left -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 19-7-7 7-7"/>
        <path d="M19 12H5"/>
      </svg>
      Back to daysift.com
    </a>
  </div>

  <script>
    // Detect platform and show appropriate shortcut
    const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
    const shortcutEl = document.getElementById('shortcut');
    shortcutEl.textContent = isMac ? '⌘J' : 'Ctrl+J';
  </script>
</body>
</html>
