<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Started with DaySift</title>
  <meta name="description" content="Press one shortcut to instantly find any doc, email, or conversation.">
  <link rel="icon" href="favicon.png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="favicon-dark.png" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      background: #F8F7F4;
      -webkit-font-smoothing: antialiased;
    }

    /* Full-page backdrop overlay */
    #daysift-activation-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: opacity 0.3s ease-out;
    }

    /* Centered modal card */
    .activation-card {
      background: white;
      border-radius: 20px;
      padding: 56px 64px;
      text-align: center;
      max-width: 480px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      animation: cardSlideUp 0.4s ease-out;
    }

    @keyframes cardSlideUp {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .logo {
      height: 40px;
      color: #1a1a1a;
      margin-bottom: 32px;
    }

    .headline {
      font-size: 28px;
      font-weight: 700;
      color: #1a1a1a;
      line-height: 1.3;
      margin-bottom: 32px;
    }

    .shortcut-container {
      margin-bottom: 24px;
    }

    .shortcut {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 16px 32px;
      font-family: inherit;
      font-size: 42px;
      font-weight: 600;
      background: linear-gradient(180deg, #f8f8f8 0%, #efefef 100%);
      border: 1px solid #e0e0e0;
      border-radius: 16px;
      color: #1a1a1a;
      box-shadow:
        0 4px 0 #d4d4d4,
        0 8px 16px rgba(0, 0, 0, 0.1);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow:
          0 4px 0 #d4d4d4,
          0 8px 16px rgba(0, 0, 0, 0.1);
      }
      50% {
        transform: scale(1.02);
        box-shadow:
          0 4px 0 #d4d4d4,
          0 12px 24px rgba(0, 0, 0, 0.15);
      }
    }

    .subheadline {
      font-size: 17px;
      color: #6b6b6b;
      line-height: 1.5;
    }

    /* Fallback state - when extension not detected */
    .fallback-content {
      display: none;
    }

    .fallback-content.visible {
      display: block;
    }

    .fallback-content h2 {
      font-size: 24px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 16px;
    }

    .fallback-content p {
      font-size: 15px;
      color: #6b6b6b;
      margin-bottom: 24px;
    }

    .install-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      background: #1a1a1a;
      color: white;
      border: none;
      border-radius: 12px;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }

    .install-btn:hover {
      background: #333;
      transform: translateY(-1px);
    }

    .install-btn svg {
      width: 20px;
      height: 20px;
    }

    /* Normal content - hidden when fallback shown */
    .normal-content {
      display: block;
    }

    .normal-content.hidden {
      display: none;
    }

    /* Dark mode support */
    @media (prefers-color-scheme: dark) {
      body {
        background: #0a0a0a;
      }

      .activation-card {
        background: #171717;
      }

      .logo {
        color: #fafafa;
      }

      .headline {
        color: #fafafa;
      }

      .shortcut {
        background: linear-gradient(180deg, #2a2a2a 0%, #1f1f1f 100%);
        border-color: #3a3a3a;
        color: #fafafa;
        box-shadow:
          0 4px 0 #0a0a0a,
          0 8px 16px rgba(0, 0, 0, 0.3);
      }

      @keyframes pulse {
        0%, 100% {
          transform: scale(1);
          box-shadow:
            0 4px 0 #0a0a0a,
            0 8px 16px rgba(0, 0, 0, 0.3);
        }
        50% {
          transform: scale(1.02);
          box-shadow:
            0 4px 0 #0a0a0a,
            0 12px 24px rgba(0, 0, 0, 0.4);
        }
      }

      .subheadline {
        color: #a1a1aa;
      }

      .fallback-content h2 {
        color: #fafafa;
      }

      .fallback-content p {
        color: #a1a1aa;
      }

      .install-btn {
        background: #fafafa;
        color: #0a0a0a;
      }

      .install-btn:hover {
        background: #e5e5e5;
      }
    }
  </style>
</head>
<body>
  <div id="daysift-activation-overlay">
    <div class="activation-card">
      <!-- DaySift Logo -->
      <svg class="logo" viewBox="0 0 381 381" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M223.926 74.9766C303.409 74.9766 354.253 120.028 354.253 190.501C354.253 260.974 303.409 306.026 223.926 306.026H111.831C109.048 306.026 106.793 303.77 106.793 300.987V275.667C106.793 272.884 109.048 270.628 111.831 270.628H223.926C278.953 270.628 312.098 239.092 312.098 190.501C312.098 141.588 278.953 110.374 223.604 110.374H111.831C109.049 110.374 106.793 108.118 106.793 105.336V80.0156C106.793 77.233 109.048 74.9767 111.831 74.9766H223.926ZM153.775 208.912C156.558 208.912 158.814 211.168 158.814 213.951V239.092C158.814 241.875 156.558 244.131 153.775 244.131H31.7852C29.0024 244.131 26.7461 241.875 26.7461 239.092V213.951C26.7461 211.168 29.0024 208.912 31.7852 208.912H153.775ZM182.703 149.798C185.486 149.798 187.742 152.053 187.742 154.836V179.978C187.742 182.76 185.486 185.016 182.703 185.016H60.7119C57.9294 185.015 55.6739 182.76 55.6738 179.978V154.836C55.674 152.053 57.9295 149.798 60.7119 149.798H182.703Z" fill="currentColor"/>
      </svg>

      <!-- Normal content - shown when extension is detected -->
      <div class="normal-content" id="normal-content">
        <h1 class="headline">Your entire workday,<br>one shortcut away.</h1>

        <div class="shortcut-container">
          <kbd class="shortcut" id="shortcut"></kbd>
        </div>

        <p class="subheadline">to instantly find any doc, email, or conversation.</p>
      </div>

      <!-- Fallback content - shown when extension NOT detected -->
      <div class="fallback-content" id="fallback-content">
        <h2>Install DaySift first</h2>
        <p>Get the Chrome extension to search your browsing history instantly.</p>
        <a href="https://chromewebstore.google.com/detail/daysift/kcdhnmbigpjffnphnlioeiaecnagakea" class="install-btn">
          <!-- Chrome icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <circle cx="12" cy="12" r="4"/>
            <line x1="21.17" y1="8" x2="12" y2="8"/>
            <line x1="3.95" y1="6.06" x2="8.54" y2="14"/>
            <line x1="10.88" y1="21.94" x2="15.46" y2="14"/>
          </svg>
          Get the Extension
        </a>
      </div>
    </div>
  </div>

  <script>
    // Detect platform and show appropriate shortcut
    const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
    const shortcutEl = document.getElementById('shortcut');
    if (shortcutEl) {
      shortcutEl.textContent = isMac ? '\u2318J' : 'Ctrl+J';
    }

    // Extension detection logic
    let extensionDetected = false;

    function showNormalContent() {
      const normalContent = document.getElementById('normal-content');
      const fallbackContent = document.getElementById('fallback-content');
      if (normalContent) normalContent.classList.remove('hidden');
      if (fallbackContent) fallbackContent.classList.remove('visible');
    }

    function showFallbackContent() {
      const normalContent = document.getElementById('normal-content');
      const fallbackContent = document.getElementById('fallback-content');
      if (normalContent) normalContent.classList.add('hidden');
      if (fallbackContent) fallbackContent.classList.add('visible');
    }

    // Check for marker attribute (set synchronously by content script)
    if (document.documentElement.getAttribute('data-daysift-installed') === 'true') {
      extensionDetected = true;
    }

    // Also listen for the extension's ready event (backup)
    document.addEventListener('daysift-extension-ready', () => {
      extensionDetected = true;
      // If fallback was shown, switch back to normal content
      showNormalContent();
    });

    // After a delay, check if extension was detected
    setTimeout(() => {
      // Check attribute again (content script may have set it after initial check)
      if (document.documentElement.getAttribute('data-daysift-installed') === 'true') {
        extensionDetected = true;
      }

      if (!extensionDetected) {
        showFallbackContent();
      }
    }, 1000);
  </script>
</body>
</html>
